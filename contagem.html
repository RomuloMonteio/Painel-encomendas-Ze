<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem de Stock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <!-- ── FORMULÁRIO ─────────────────────────────────────────────────── -->
      <div id="estado-form">

        <!-- Erro -->
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-3"
             id="form-erro" style="display:none!important">
          <i class="fas fa-circle-exclamation"></i>
          <span></span>
        </div>

        <!-- Cabeçalho -->
        <div class="marca-header mb-3">
          <span class="marca-badge" id="marca-badge"></span>
          <div class="flex-fill">
            <h5 class="fw-bold mb-0">Contagem de Stock</h5>
            <span class="text-muted" style="font-size:.82rem;" id="data-hoje"></span>
          </div>
          <div class="d-none d-md-flex align-items-center gap-2 text-muted" style="font-size:.8rem;">
            <span style="color:#16a34a;font-weight:600;"><i class="fas fa-circle me-1" style="font-size:.55rem;"></i>Em uso</span>
            <span style="color:#dc2626;font-weight:600;"><i class="fas fa-circle me-1" style="font-size:.55rem;"></i>Vazia(s)</span>
            <span style="color:#2563eb;font-weight:600;"><i class="fas fa-circle me-1" style="font-size:.55rem;"></i>Reserva</span>
            <span style="color:#7c3aed;font-weight:600;"><i class="fas fa-circle me-1" style="font-size:.55rem;"></i>Qtd. Garrafas</span>
          </div>
        </div>

        <form id="formContagem" novalidate>
          <!-- categorias injectadas pelo JS -->
          <div id="form-contagem"></div>

          <!-- Rodapé -->
          <div class="form-footer">
            <div class="row align-items-center g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small mb-1">Observações (opcional)</label>
                <textarea id="observacoes" class="form-control" rows="2"
                          placeholder="Notas gerais sobre a contagem…"
                          style="resize:none;font-size:.875rem;"></textarea>
              </div>
              <div class="col-md-6 d-flex flex-column align-items-md-end gap-3">
                <div class="d-flex gap-2">
                  <a href="dashboard.html" class="btn-outline-custom py-2 px-3">
                    <i class="fas fa-arrow-left"></i> Cancelar
                  </a>
                  <button type="submit" class="btn-primary-custom py-2 px-4" id="btn-submit"
                          style="background:#003087;">
                    <i class="fas fa-save me-1"></i>Guardar Contagem
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- ── SUCESSO ──────────────────────────────────────────────────── -->
      <div id="estado-sucesso" class="card" style="display:none">
        <div class="success-card">
          <div class="success-icon"><i class="fas fa-check"></i></div>
          <h4 class="fw-bold mb-2">Contagem guardada!</h4>
          <p class="text-muted mb-4">O registo de stock foi guardado com sucesso.</p>
          <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
            <button id="btn-pdf-sucesso" class="btn-primary-custom justify-content-center px-4 py-2"
                    style="background:#dc2626;">
              <i class="fas fa-file-pdf me-2"></i>Gerar PDF
            </button>
            <a id="btn-nova" href="#" class="btn-outline-custom justify-content-center px-4 py-2">
              <i class="fas fa-rotate-right me-2"></i>Nova Contagem
            </a>
            <a href="dashboard.html" class="btn-outline-custom justify-content-center px-4 py-2">
              <i class="fas fa-house me-2"></i>Dashboard
            </a>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
  document.getElementById('data-hoje').textContent =
    new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('btn-nova').href = location.href;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="assets/js/pages/contagem.js"></script>
</body>
</html>
