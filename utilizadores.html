<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <title>Utilizadores</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" id="form-erro" style="display:none!important">
        <i class="fas fa-circle-exclamation"></i>
        <span></span>
      </div>

      <div class="card">
        <div class="card-header">
          <span><i class="fas fa-users-gear me-2 text-muted"></i>Utilizadores
            <span class="badge bg-light text-secondary ms-2 fw-semibold" id="total-badge">—</span>
          </span>
          <button type="button" class="btn-primary-custom py-1 px-3" id="btn-novo-utilizador" style="font-size:.85rem;">
            <i class="fas fa-plus me-1"></i>Novo Utilizador
          </button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table-modern">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Email</th>
                  <th class="text-center">Nível</th>
                  <th style="width:120px;"></th>
                </tr>
              </thead>
              <tbody id="tbody-utilizadores">
                <tr><td colspan="4" class="text-center py-4 text-muted">
                  <i class="fas fa-spinner fa-spin me-2"></i>A carregar…
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ── Modal Adicionar/Editar Utilizador ─────────────────────────────── -->
<div class="modal fade" id="modalUtilizador" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="border-bottom:none;">
        <h5 class="modal-title fw-bold mb-0" id="modal-utilizador-titulo">Novo Utilizador</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="formUtilizador">
        <div class="modal-body pt-0">
          <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" id="modal-form-erro" style="display:none!important">
            <i class="fas fa-circle-exclamation"></i>
            <span></span>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold mb-1">Nome</label>
            <input type="text" id="input-nome" class="form-control" required>
          </div>
          <div class="mb-3" id="wrapper-email">
            <label class="form-label small fw-semibold mb-1">Email</label>
            <input type="email" id="input-email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold mb-1" id="label-password">Password</label>
            <input type="password" id="input-password" class="form-control" minlength="6" autocomplete="new-password">
            <span class="text-muted" style="font-size:.75rem;" id="hint-password"></span>
          </div>
          <div class="mb-1">
            <label class="form-label small fw-semibold mb-1">Nível</label>
            <select id="input-nivel" class="form-select">
              <option value="funcionario">Funcionário</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
        </div>
        <div class="modal-footer" style="border-top:1px solid var(--border);">
          <button type="button" class="btn-outline-custom py-2 px-3" data-bs-dismiss="modal">
            <i class="fas fa-xmark me-1"></i>Cancelar
          </button>
          <button type="submit" class="btn-primary-custom py-2 px-3" id="btn-guardar-utilizador">
            <i class="fas fa-save me-1"></i>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/pages/utilizadores.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
