<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card blue">
            <div class="stat-icon blue"><i class="fas fa-calendar-day"></i></div>
            <div class="stat-value" id="stat-hoje">—</div>
            <div class="stat-label">Contagens hoje</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card green">
            <div class="stat-icon green"><i class="fas fa-calendar-check"></i></div>
            <div class="stat-value" id="stat-mes">—</div>
            <div class="stat-label">Este mês</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card" style="border-top:3px solid #003087">
            <div class="stat-icon" style="background:#e8f0ff;color:#003087"><i class="fas fa-beer-mug-empty"></i></div>
            <div class="stat-value" id="stat-sb">—</div>
            <div class="stat-label">Super Bock (mês)</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card red">
            <div class="stat-icon red"><i class="fas fa-bottle-water"></i></div>
            <div class="stat-value" id="stat-sumol">—</div>
            <div class="stat-label">Sumol (mês)</div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <!-- Gráfico -->
        <div class="col-md-7">
          <div class="card h-100">
            <div class="card-header">
              <span><i class="fas fa-chart-bar me-2 text-primary"></i>Contagens — Últimos 7 dias</span>
            </div>
            <div class="card-body">
              <div class="chart-container">
                <canvas id="chartSemanal"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Ações rápidas -->
        <div class="col-md-5">
          <div class="card h-100">
            <div class="card-header">
              <span><i class="fas fa-bolt me-2 text-warning"></i>Ações Rápidas</span>
            </div>
            <div class="card-body d-flex flex-column gap-3">
              <a href="contagem.html?marca=super-bock"
                 class="btn-primary-custom justify-content-center py-3"
                 style="background:linear-gradient(135deg,#003087,#1a4fa0);border-radius:10px;font-size:.95rem;">
                <i class="fas fa-clipboard-list me-2"></i>Nova Contagem Super Bock
              </a>
              <a href="contagem.html?marca=sumol"
                 class="btn-primary-custom justify-content-center py-3"
                 style="background:linear-gradient(135deg,#c41a1a,#e31e24);border-radius:10px;font-size:.95rem;">
                <i class="fas fa-clipboard-list me-2"></i>Nova Contagem Sumol
              </a>
              <a href="historico-contagens.html" class="btn-outline-custom justify-content-center py-2" style="border-radius:10px;">
                <i class="fas fa-clock-rotate-left me-2"></i>Ver Histórico de Contagens
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Últimas contagens -->
      <div class="card">
        <div class="card-header">
          <span><i class="fas fa-clipboard-check me-2 text-muted"></i>Últimas Contagens</span>
          <a href="historico-contagens.html" style="font-size:.82rem;color:#3b82f6;">Ver todas</a>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table-modern">
              <thead>
                <tr>
                  <th>Data</th><th>Marca</th><th>Utilizador</th>
                  <th class="text-center">Produtos</th><th class="text-center">Estado Stock</th>
                </tr>
              </thead>
              <tbody id="tbody-ultimas">
                <tr><td colspan="5" class="text-center py-4 text-muted">
                  <i class="fas fa-spinner fa-spin me-2"></i>A carregar…
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script type="module" src="assets/js/pages/dashboard.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
