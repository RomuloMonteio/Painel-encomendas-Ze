<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <title>Histórico de Contagens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <!-- Filtros -->
      <div class="filter-bar mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-3">
            <label class="form-label small fw-semibold mb-1">Marca</label>
            <select id="f-marca" class="form-select form-select-sm">
              <option value="">Todas as marcas</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">De</label>
            <input type="date" id="f-inicio" class="form-control form-control-sm">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Até</label>
            <input type="date" id="f-fim" class="form-control form-control-sm">
          </div>
          <div class="col-12 col-md-5 d-flex gap-2 align-items-end">
            <button id="btn-limpar" class="btn-outline-custom py-1 px-3 justify-content-center">
              <i class="fas fa-xmark me-1"></i>Limpar
            </button>
            <a href="contagem.html?marca=super-bock"
               class="btn-primary-custom py-1 px-3 justify-content-center ms-auto"
               style="background:#003087;font-size:.85rem;">
              <i class="fas fa-plus me-1"></i>Nova Contagem SB
            </a>
            <a href="contagem.html?marca=sumol"
               class="btn-primary-custom py-1 px-3 justify-content-center"
               style="background:#E31E24;font-size:.85rem;">
              <i class="fas fa-plus me-1"></i>Nova Contagem SM
            </a>
            <a href="contagem.html?marca=cozinha"
               class="btn-primary-custom py-1 px-3 justify-content-center"
               style="background:#d97706;font-size:.85rem;">
              <i class="fas fa-plus me-1"></i>Nova Contagem CZ
            </a>
          </div>
        </div>
      </div>

      <!-- Tabela -->
      <div class="card">
        <div class="card-header">
          <span>
            <i class="fas fa-clipboard-check me-2 text-muted"></i>Contagens de Stock
            <span class="badge bg-light text-secondary ms-2 fw-semibold" id="total-badge">—</span>
          </span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table-modern">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Marca</th>
                  <th>Utilizador</th>
                  <th class="text-center">Produtos</th>
                  <th class="text-center">Estado Stock</th>
                  <th style="width:90px;"></th>
                </tr>
              </thead>
              <tbody id="tbody-contagens">
                <tr><td colspan="6" class="text-center py-4 text-muted">
                  <i class="fas fa-spinner fa-spin me-2"></i>A carregar…
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center px-4 py-3 border-top">
            <span style="font-size:.82rem;color:var(--text-muted);" id="pag-info"></span>
            <div class="pagination-custom" id="paginacao"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ── Modal detalhe da contagem ─────────────────────────────────────── -->
<div class="modal fade" id="modalContagem" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header" id="modal-header" style="border-bottom:none;">
        <div>
          <h5 class="modal-title fw-bold mb-0" id="modal-titulo">Contagem de Stock</h5>
          <small class="text-muted" id="modal-subtitulo"></small>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-0" id="modal-body">
        <!-- conteúdo injectado pelo JS -->
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border);">
        <button type="button" class="btn-outline-custom py-2 px-3" data-bs-dismiss="modal">
          <i class="fas fa-xmark me-1"></i>Fechar
        </button>
        <button type="button" class="btn-primary-custom py-2 px-3" id="modal-btn-pdf"
                style="background:#dc2626;">
          <i class="fas fa-file-pdf me-1"></i>Gerar PDF
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="assets/js/pages/historico-contagens.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
