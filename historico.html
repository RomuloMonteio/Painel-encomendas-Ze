<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — Encomendas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <!-- Filtros -->
      <div class="filter-bar mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-3">
            <label class="form-label small fw-semibold mb-1">Marca</label>
            <select id="f-marca" class="form-select form-select-sm">
              <option value="">Todas as marcas</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Estado</label>
            <select id="f-estado" class="form-select form-select-sm">
              <option value="">Todos</option>
              <option value="enviada">Enviada</option>
              <option value="confirmada">Confirmada</option>
              <option value="entregue">Entregue</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">De</label>
            <input type="date" id="f-inicio" class="form-control form-control-sm">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Até</label>
            <input type="date" id="f-fim" class="form-control form-control-sm">
          </div>
          <div class="col-12 col-md-3 d-flex gap-2">
            <button id="btn-limpar" class="btn-outline-custom py-1 px-3 justify-content-center">
              <i class="fas fa-xmark me-1"></i>Limpar
            </button>
          </div>
        </div>
      </div>

      <!-- Tabela -->
      <div class="card">
        <div class="card-header">
          <span>
            <i class="fas fa-clock-rotate-left me-2 text-muted"></i>Encomendas
            <span class="badge bg-light text-secondary ms-2 fw-semibold" id="total-badge">—</span>
          </span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table-modern">
              <thead>
                <tr>
                  <th>Número</th><th>Marca</th><th>Utilizador</th>
                  <th>Total Unid.</th><th>Estado</th><th>Data</th><th style="width:60px;"></th>
                </tr>
              </thead>
              <tbody id="tbody-historico">
                <tr><td colspan="7" class="text-center py-4 text-muted">
                  <i class="fas fa-spinner fa-spin me-2"></i>A carregar…
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center px-4 py-3 border-top">
            <span style="font-size:.82rem;color:var(--text-muted);" id="pag-info"></span>
            <div class="pagination-custom" id="paginacao"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="assets/js/pages/historico.js"></script>
</body>
</html>
