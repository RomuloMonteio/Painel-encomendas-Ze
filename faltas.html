<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <title>Lista de Faltas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <!-- Cabeçalho do ciclo -->
      <div class="marca-header mb-3">
        <span class="marca-badge" style="background:#0891b2;"><i class="fas fa-cart-shopping me-2"></i>Faltas</span>
        <div class="flex-fill">
          <h5 class="fw-bold mb-0">Lista de Faltas</h5>
          <span class="text-muted" style="font-size:.82rem;" id="ciclo-info">A carregar…</span>
        </div>
      </div>

      <!-- Adicionar item -->
      <div class="card mb-3">
        <div class="card-body">
          <form id="formAdicionarFalta" class="d-flex gap-2 flex-wrap" novalidate>
            <input type="text" id="input-item" class="form-control" style="flex:1;min-width:200px;"
                   placeholder="Adicionar item em falta…" list="dl-catalogo-faltas" autocomplete="off" required>
            <datalist id="dl-catalogo-faltas"></datalist>
            <button type="submit" class="btn-primary-custom px-4">
              <i class="fas fa-plus me-1"></i>Adicionar
            </button>
          </form>
        </div>
      </div>

      <!-- Pendentes -->
      <div class="card mb-3">
        <div class="card-header">
          <span><i class="fas fa-list-check me-2 text-warning"></i>Pendentes</span>
          <span class="badge bg-light text-secondary" id="badge-pendentes">0</span>
        </div>
        <div class="card-body p-0">
          <div id="lista-pendentes"></div>
        </div>
      </div>

      <!-- Já comprados -->
      <div class="card mb-3">
        <div class="card-header">
          <span><i class="fas fa-check-double me-2 text-success"></i>Já Comprados</span>
          <span class="badge bg-light text-secondary" id="badge-completos">0</span>
        </div>
        <div class="card-body p-0">
          <div id="lista-completos"></div>
        </div>
      </div>

      <!-- Entregar ciclo -->
      <div class="card mb-3">
        <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-2">
          <span class="text-muted" style="font-size:.85rem;">
            <i class="fas fa-circle-info me-1"></i>Ao marcar como entregue, esta lista fecha e uma nova começa vazia.
          </span>
          <button type="button" id="btn-entregar" class="btn-primary-custom px-4" style="background:#16a34a;">
            <i class="fas fa-truck me-1"></i>Marcar Lista como Entregue
          </button>
        </div>
      </div>

      <!-- Histórico de ciclos -->
      <div class="card">
        <div class="card-header" id="header-historico" style="cursor:pointer;">
          <span><i class="fas fa-clock-rotate-left me-2 text-muted"></i>Ciclos Anteriores</span>
          <i class="fas fa-chevron-down" id="icon-historico"></i>
        </div>
        <div class="card-body" id="body-historico" style="display:none;">
          <div id="lista-historico" class="text-muted text-center py-3">A carregar…</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/pages/faltas.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
